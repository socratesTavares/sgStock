# =============================================================================
# Configuração de Produção Nginx para o Sistema sgStock (Ubuntu Server)
# Ficheiro: /etc/nginx/sites-available/sgstock
# =============================================================================

# Redirecionamento forçado de HTTP para HTTPS (Opcional caso possua certificado SSL)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name stock.empresa.gov.mz seu-ip-ou-dominio;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name _; # Altere para o seu domínio ou deixe '_' para responder a qualquer IP

    # Diretório dos ficheiros estáticos do frontend
    root /var/www/sgStock/frontend;
    index index.html;

    # Limite máximo de upload (payloads JSON e anexos)
    client_max_body_size 10M;

    # Otimização de Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Roteamento do Frontend Estático
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Desativa cache para o index.html e login.html para garantir atualizações imediatas
    location ~* (index|login)\.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Proxy Reverso para a API Node.js (Gerenciada pelo PM2 na porta 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Headers para WebSockets e conexões persistentes HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers de encaminhamento de IP real do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts de proxy adequados para operações de base de dados
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Desativa buffering de proxy para respostas imediatas
        proxy_buffering off;
    }

    # Bloqueio de ficheiros ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
